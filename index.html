<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bringy — obchod s obuvou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111014;--panel:#f5f4ee;--paper:#ffffff;--steel:#6b6e76;--flare:#ff2f6e;--line:rgba(17,16,20,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'Space Grotesk',system-ui,sans-serif;
  background-image:repeating-linear-gradient(0deg,rgba(17,16,20,.025) 0 1px,transparent 1px 3px)}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{padding:64px 0 32px;border-bottom:2px solid var(--ink)}
.tag{display:inline-block;font-size:.8rem;letter-spacing:.08em;color:var(--flare);border:1px solid var(--flare);padding:3px 10px;transform:rotate(-2deg);margin-bottom:18px}
h1{font-family:'Archivo Black',system-ui,sans-serif;font-size:clamp(3rem,11vw,7rem);line-height:.85;margin:0;letter-spacing:-.01em;text-transform:uppercase}
h1 span{color:var(--flare)}
.lead{font-weight:700;font-size:1.15rem;margin:18px 0 0}
header p{color:var(--steel);max-width:44ch;margin:8px 0 0;font-size:1.05rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:20px 0;position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:1px solid var(--line)}
.bar input,.bar select{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:11px 14px;font:600 .95rem 'Space Grotesk',sans-serif}
.bar input{flex:1;min-width:200px}
.bar input::placeholder{color:var(--steel)}
:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px;padding:36px 0 80px}
.product-link{display:block;color:inherit;text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);position:relative;transition:transform .15s}
.card:nth-child(3n){transform:rotate(-1deg)}
.card:nth-child(3n+1){transform:rotate(.8deg)}
.card:nth-child(3n+2){transform:rotate(-.4deg)}
.card:hover{transform:rotate(0deg) translateY(-3px)}
.tape{position:absolute;top:-8px;left:16px;width:56px;height:18px;background:repeating-linear-gradient(45deg,rgba(17,16,20,.16) 0 2px,rgba(17,16,20,.05) 2px 6px);transform:rotate(-4deg)}
.ph{aspect-ratio:1;display:grid;place-items:center;font-family:'Archivo Black',sans-serif;font-size:5rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05)}
.body{padding:16px}
.brand{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.name{font-weight:700;font-size:1.1rem;margin:4px 0 12px;text-transform:uppercase}
.price{display:inline-block;background:var(--flare);color:#fff;font-weight:800;font-size:1.1rem;padding:3px 10px;transform:rotate(-1.5deg)}
.meta{color:var(--steel);font-size:.85rem;margin-top:10px}
.out{display:inline-block;margin-top:10px;border:1px solid var(--steel);color:var(--steel);font-size:.75rem;text-transform:uppercase;padding:2px 8px}
.msg{grid-column:1/-1;color:var(--steel);padding:60px 0;font-size:1.1rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">Nová dodávka</span>
    <h1>Bring<span>y</span></h1>
    <p class="lead">Obuv desiatok značiek na jednom mieste.</p>
    <p id="sub">Načítavame katalóg…</p>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Nájsť model, značku, farbu" aria-label="Hľadať">
    <select id="brand" aria-label="Značka" hidden></select>
    <select id="sex" aria-label="Pohlavie" hidden></select>
    <select id="sort" aria-label="Zoradiť">
      <option value="">Filter</option>
      <option value="asc">Najprv lacnejšie</option>
      <option value="desc">Najprv drahšie</option>
    </select>
  </div>
  <main id="grid"></main>
</div>
<script>
const CFG = { api: 'https://bringy-api-896645809822.europe-west3.run.app', pollMs: 60000, currency: '€' };
const KEYS = {
  name: ['name','title','model','product_name'],
  brand: ['brand','brand_name','manufacturer'],
  price: ['price','cost','price_eur'],
  image: ['image','image_url','photo','img','picture'],
  color: ['color','colour'],
  sex: ['sex','gender'],
  stock: ['in_stock','stock','available','quantity']
};
let map = {}, rows = [], lastText = '';
const $ = s => document.querySelector(s);
const pick = (r, k) => map[k] ? r[map[k]] : undefined;
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const inStock = v => !(v === false || v === 'f' || v === 0 || v === '0');
function sexOption(value) {
  const normalized = String(value).trim().toLowerCase();
  if (value === true || ['true','t','1','female','women','woman','žena','ženy','dámske','dámska'].includes(normalized)) {
    return { value: 'female', label: 'Dámske' };
  }
  if (value === false || ['false','f','0','male','men','man','muž','muži','pánske','pánska'].includes(normalized)) {
    return { value: 'male', label: 'Pánske' };
  }
  if (['unisex','unisexové'].includes(normalized)) return { value: 'unisex', label: 'Unisex' };
  return { value: normalized, label: String(value) };
}

function render() {
  const q = $('#q').value.toLowerCase(), b = $('#brand').value, sex = $('#sex').value, s = $('#sort').value;
  const list = rows.filter(r => (!b || pick(r, 'brand') == b) &&
    (!sex || sexOption(pick(r, 'sex')).value === sex) &&
    (!q || Object.values(r).join(' ').toLowerCase().includes(q)));
  if (s) list.sort((x, y) => (pick(x, 'price') - pick(y, 'price')) * (s === 'asc' ? 1 : -1));
  const g = $('#grid'); g.replaceChildren();
  if (!list.length) return g.append(h('div', 'msg', rows.length ? 'Nič sme nenašli. Skúste iný dopyt.' : 'V katalógu zatiaľ nie sú žiadne produkty.'));
  for (const r of list) {
    const name = pick(r, 'name') ?? '';
    const hue = [...String(name)].reduce((a, c) => a + c.charCodeAt(0), 0) * 7 % 360;
    const ph = h('div', 'ph', String(name).charAt(0)); ph.style.background = `hsl(${hue} 35% 90%)`; ph.style.color = 'rgba(17,16,20,.28)';
    const src = pick(r, 'image');
    if (src) { const i = new Image(); i.alt = name; i.onload = () => ph.replaceChildren(i); i.src = String(src).replace(/\\/g, '/'); }
    const bd = h('div', 'body');
    if (pick(r, 'brand')) bd.append(h('div', 'brand', pick(r, 'brand')));
    bd.append(h('div', 'name', name));
    const p = pick(r, 'price');
    if (p != null) bd.append(h('div', 'price', Number(p).toLocaleString('sk-SK') + ' ' + CFG.currency));
    const color = pick(r, 'color');
    if (color) bd.append(h('div', 'meta', color));
    if (map.stock && !inStock(pick(r, 'stock'))) bd.append(h('span', 'out', 'Vypredané'));
    const c = h('article', 'card'); c.append(h('div', 'tape'), ph, bd);
    if (r.id != null) { const a = h('a', 'product-link'); a.href = 'product.html?id=' + encodeURIComponent(r.id); a.append(c); g.append(a); }
    else g.append(c);
  }
}

async function load() {
  if (document.hidden && lastText) return;
  try {
    const res = await fetch(CFG.api + '/products');
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    if (text === lastText) return;
    lastText = text;
    rows = JSON.parse(text);
    const cols = Object.keys(rows[0] || {});
    for (const k in KEYS) map[k] = KEYS[k].find(c => cols.includes(c));
    const sel = $('#brand'), cur = sel.value;
    const brands = [...new Set(rows.map(r => pick(r, 'brand')).filter(Boolean))].sort();
    sel.replaceChildren(new Option('Všetky značky', ''), ...brands.map(x => new Option(x, x)));
    sel.value = brands.includes(cur) ? cur : ''; sel.hidden = !brands.length;
    const sexSelect = $('#sex'), currentSex = sexSelect.value;
    const genders = [...new Map(rows.map(r => pick(r, 'sex')).filter(v => v != null && v !== '')
      .map(value => { const option = sexOption(value); return [option.value, option]; })).values()]
      .sort((a, b) => a.label.localeCompare(b.label, 'sk'));
    sexSelect.replaceChildren(new Option('Všetky pohlavia', ''), ...genders.map(x => new Option(x.label, x.value)));
    sexSelect.value = genders.some(x => x.value === currentSex) ? currentSex : '';
    sexSelect.hidden = !genders.length;
    $('#sub').textContent = `${rows.length} modelov v katalógu. Ceny a dostupnosť sa aktualizujú automaticky.`;
    render();
  } catch (e) {
    if (!lastText) { $('#sub').textContent = ''; $('#grid').replaceChildren(h('div', 'msg', 'Katalóg sa nepodarilo načítať. Skúste to o chvíľu.')); }
  }
}
['input', 'change'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest('.bar')) render(); }));
load(); setInterval(load, CFG.pollMs);
</script>
</body>
</html>
